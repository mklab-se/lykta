<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lykta: Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --panel: #0b0d10; --line: #1c2129; --text: #e8edf3; --muted: #7d8794; --dim: #4a525d;
    --red: #ff3d4d; --green: #2fe07f; --amber: #ffb224; --grey: #3a414b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden; }

  /* Floating controls: auto-hide when the mouse is still (kiosk-friendly) */
  #chrome { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px; background: rgba(16,18,22,.92); border: 1px solid #262b33; border-radius: 14px; z-index: 50; font-size: 14px; backdrop-filter: blur(8px); transition: opacity .5s, transform .5s; }
  #chrome.hidden { opacity: 0; transform: translateX(-50%) translateY(20px); pointer-events: none; }
  #chrome button { font: inherit; color: var(--text); background: #171a20; border: 1px solid #262b33; border-radius: 9px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  #chrome button.on { background: #e8edf3; color: #000; border-color: #e8edf3; font-weight: 600; }
  #chrome .sep { width: 1px; height: 26px; background: #2a2f37; margin: 0 4px; }
  #chrome .lbl { color: var(--muted); padding: 0 4px; }
  #chrome .pick { background: #10331f; border-color: #1f6b41; }
  #chrome .pick.picked { background: var(--green); color: #000; font-weight: 700; }

  #tv { position: fixed; left: 0; top: 0; width: 1920px; background: var(--bg); overflow: hidden; transform-origin: 0 0; }
  #canvas { position: absolute; inset: 0; animation: drift 240s ease-in-out infinite alternate; }
  @keyframes drift { 0% { transform: translate(0,0); } 33% { transform: translate(6px,-4px); } 66% { transform: translate(-5px,5px); } 100% { transform: translate(4px,3px); } }

  /* ---------- shared ---------- */
  .header { display: flex; align-items: center; gap: 22px; height: 80px; padding: 0 40px; flex: none; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: .5px; color: #cfd6de; }
  .lantern { width: 24px; height: 32px; border-radius: 8px 8px 10px 10px; background: radial-gradient(circle at 50% 60%, #ffd27a 0 30%, #b97a10 70%); box-shadow: 0 0 22px rgba(255,190,80,.45); }
  .counts { display: flex; gap: 12px; margin-left: 14px; }
  .count { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 600; color: var(--muted); padding: 7px 16px; border-radius: 999px; background: #0d1014; }
  .count b { color: var(--text); font-size: 27px; }
  .count.red b { color: var(--red); } .count.amber b { color: var(--amber); } .count.green b { color: var(--green); }
  .clock { margin-left: auto; font-size: 30px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .dot.failed { background: var(--red); box-shadow: 0 0 14px var(--red); }
  .dot.running { background: var(--amber); box-shadow: 0 0 14px var(--amber); animation: pulse 1.6s ease-in-out infinite; }
  .dot.passed { background: var(--green); }
  .dot.never { border: 2px dashed var(--dim); }
  .dot.missing { border: 3px solid var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }
  .repo { color: var(--muted); font-weight: 500; }
  .meta { color: var(--muted); font-size: 20px; display: flex; gap: 20px; }
  .meta b { color: #c3cbd4; font-weight: 600; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .section-label { font-size: 18px; font-weight: 800; letter-spacing: 3px; color: var(--dim); margin: 0 0 10px 2px; display: flex; gap: 14px; align-items: center; flex: none; }
  .pager { display: flex; gap: 6px; } .pager i { width: 8px; height: 8px; border-radius: 50%; background: #262b33; } .pager i.on { background: #8a939e; }

  /* runner badges */
  .where-run { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #aeb7c2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where-run .k { padding: 1px 7px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #000; flex: none; }
  .k.gh { background: #c9d1d9; } .k.k8s { background: #5aa9ff; } .k.lab { background: #c792ff; }

  /* failure card */
  .fail { position: relative; border-radius: 20px; background: linear-gradient(160deg, #2a070c 0%, #140306 60%, #0d0204 100%); border: 2px solid rgba(255,61,77,.55); padding: 18px 24px; overflow: hidden; display: flex; flex-direction: column; gap: 9px; min-height: 0; min-width: 0; }
  .fail::before { content: ""; position: absolute; inset: -40%; background: radial-gradient(circle at 20% 0%, rgba(255,61,77,.2), transparent 55%); animation: breathe 6s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 50% { opacity: .35; } }
  .fail > * { position: relative; flex-shrink: 0; }
  .fail .tag { font-size: 18px; font-weight: 800; letter-spacing: 3px; color: var(--red); display: flex; align-items: center; gap: 10px; }
  .fail .name { font-size: 36px; font-weight: 800; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fail .broken { font-size: 26px; font-weight: 700; color: #ffb3ba; }
  .fail .where { font-size: 21px; color: #ffd5d9; display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; }
  .fail .where .x { width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #000; display: grid; place-items: center; font-weight: 900; font-size: 16px; flex: none; }
  .fail .log { flex-shrink: 1; min-height: 0; font-family: "JetBrains Mono", monospace; font-size: 17px; line-height: 1.45; background: rgba(0,0,0,.55); border-radius: 10px; padding: 10px 14px; color: #c9ced6; border-left: 4px solid var(--red); white-space: pre; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .fail .log .err { color: #ff8a94; }
  .fail .ai { font-size: 17px; color: #ffd9a3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .fail.fresh { animation: arrive 1.4s cubic-bezier(.2,.9,.2,1) both; }
  @keyframes arrive { 0% { box-shadow: 0 0 0 0 rgba(255,61,77,.9); transform: scale(1.04); } 40% { box-shadow: 0 0 0 26px rgba(255,61,77,0); } 100% { box-shadow: 0 0 0 0 rgba(255,61,77,0); transform: scale(1); } }
  /* dense failure row (when many fail) */
  .failrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 14px; align-items: center; border-radius: 14px; background: linear-gradient(90deg, #26070b, #12040690); border: 1px solid rgba(255,61,77,.45); padding: 10px 16px 10px 0; min-width: 0; overflow: hidden; }
  .failrow .bar { align-self: stretch; background: var(--red); box-shadow: 0 0 14px var(--red); border-radius: 0 6px 6px 0; }
  .failrow .nm { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .failrow .sub { font-size: 16px; color: #ffc2c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .failrow .dur { font-size: 20px; font-weight: 700; color: #ffb3ba; font-variant-numeric: tabular-nums; }
  .failrow.fresh { animation: arrive 1.4s both; }

  /* running card */
  .run { border-radius: 20px; background: linear-gradient(160deg, #1b1504 0%, #0d0b05 70%); border: 2px solid rgba(255,178,36,.45); padding: 16px 22px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; min-height: 0; min-width: 0; }
  .run > * { flex-shrink: 0; }
  .run .tag { font-size: 18px; font-weight: 800; letter-spacing: 3px; color: var(--amber); display: flex; align-items: center; gap: 10px; }
  .run .name { font-size: 30px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .elapsed { margin-left: auto; font-size: 24px; font-weight: 700; color: #ffd690; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .run .progress { margin-left: 14px; font-size: 18px; color: #c9a86a; letter-spacing: 0; font-weight: 600; }
  .graph { position: relative; flex: 1 1 0; min-height: 0; display: flex; gap: 26px; align-items: center; justify-content: flex-start; }
  .graph svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .col { display: flex; flex-direction: column; gap: 8px; justify-content: center; z-index: 1; min-width: 0; }
  .node { width: 200px; border-radius: 12px; padding: 7px 11px; background: #14171c; border: 2px solid #262b33; font-size: 18px; font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
  .node .row { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .node .row span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #000; }
  .node.queued { color: var(--muted); } .node.queued .st { border: 2px dashed var(--dim); }
  .node.running { border-color: var(--amber); background: #221a06; }
  .node.running .st, .mini.running { border: 3px solid rgba(255,178,36,.3); border-top-color: var(--amber); animation: spin .9s linear infinite; }
  .node.success { border-color: rgba(47,224,127,.45); } .node.success .st { background: var(--green); }
  .node.failure { border-color: var(--red); background: #2a080d; } .node.failure .st { background: var(--red); }
  .node.skipped { opacity: .4; } .node.skipped .st { background: var(--grey); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .node .step { font-size: 15px; font-weight: 500; color: #ffd690; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .bar { height: 5px; border-radius: 3px; background: #2d250f; overflow: hidden; }
  .node .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb224, #ffe08a); transition: width .7s ease; }
  /* matrix group + collapsed nodes */
  .node.group { width: 230px; }
  .dots { display: grid; grid-template-columns: repeat(8, 14px); gap: 5px; padding: 2px 0; }
  .mini { width: 14px; height: 14px; border-radius: 4px; background: #262b33; }
  .mini.success { background: var(--green); } .mini.failure { background: var(--red); } .mini.queued { background: transparent; border: 2px solid #343a44; } .mini.skipped { background: #2a2f37; }
  .mini.running { border-radius: 50%; background: transparent; }
  .node .cnt { font-size: 15px; color: var(--muted); font-weight: 600; }
  .node.collapsed { width: 150px; align-items: center; text-align: center; font-size: 17px; }
  .node.collapsed.done { border-color: rgba(47,224,127,.35); color: #9fe8be; background: #0a1a12; }
  .node.collapsed.later { border-style: dashed; color: var(--muted); }

  .lanes { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; flex: 1 1 0; border-top: 1px solid #2a2310; padding-top: 10px; }
  .lane { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) minmax(0,2fr) minmax(0,1.5fr); align-items: center; gap: 16px; height: 34px; font-size: 18px; font-weight: 600; color: #e9dcc0; flex: none; }
  .lane .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane .segs { display: flex; gap: 3px; height: 12px; }
  .lane .segs i { flex: 1; border-radius: 3px; background: #2a2414; }
  .lane .segs i.d { background: #3fae6d; } .lane .segs i.n { background: var(--amber); animation: pulse 1.2s infinite; } .lane .segs i.f { background: var(--red); }
  .lane .cur { color: #ffd690; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 17px; }
  .lane.failure .ln { color: #ff9aa3; } .lane.failure .cur { color: #ff9aa3; }
  .lane.more { display: block; color: var(--muted); font-weight: 500; }

  /* idle: cards, chips and cells */
  .chip { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
  .chip .txt { display: flex; flex-direction: column; min-width: 0; }
  .chip .nm { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .sub { font-size: 17px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell { display: flex; align-items: center; gap: 9px; padding: 0 12px; border-radius: 9px; background: #080a0c; border: 1px solid #14181d; min-width: 0; font-size: 17px; font-weight: 600; color: #b9c2cc; }
  .cell .dot { width: 10px; height: 10px; box-shadow: none; }
  .cell span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.never { color: var(--muted); } .cell.missing { border-color: rgba(255,61,77,.6); color: #ff9aa3; }
  .calm { flex: 1; display: grid; place-items: center; color: var(--dim); font-size: 30px; border: 2px dashed #14181d; border-radius: 20px; min-height: 0; }

  .itile { border-radius: 16px; background: linear-gradient(170deg, #08170f, #050a07); border: 1px solid #123a25; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow: hidden; }
  .itile.never { background: #07090b; border: 1px dashed #2a3039; }
  .itile .top { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; letter-spacing: 2px; color: #4fd18b; }
  .itile.never .top { color: var(--muted); }
  .itile .when { margin-left: auto; letter-spacing: 0; font-weight: 600; color: var(--muted); font-size: 17px; }
  .itile.big .nm { font-size: 34px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e3f6ea; }
  .itile.big .rp { font-size: 19px; color: var(--muted); margin-top: -4px; }
  .itile .sub { font-size: 17px; color: #9aa6b2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .itile .sub b { color: #c3cbd4; }
  .itile.mid .top { letter-spacing: 0; font-size: 22px; color: #dfe8e2; font-weight: 700; }
  .itile.mid .top .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist { display: flex; gap: 4px; margin-top: auto; }
  .hist i { flex: 1; height: 14px; border-radius: 3px; background: #1e6b43; }
  .hist i.f { background: var(--red); }
  .dock { position: relative; overflow: hidden; flex: none; }
  .ditem { position: absolute; left: 0; right: 0; top: 0; overflow: hidden; border-radius: 20px; will-change: transform, height; }
  .ditem .lv { position: absolute; inset: 0; transition: opacity .45s ease; }
  .ditem .lv.big { display: grid; }
  .ditem .lv.big .run { height: 100%; }
  .midrun, .smallrun { height: 100%; border-radius: 18px; background: linear-gradient(90deg, #1b1504, #0d0b05); border: 2px solid rgba(255,178,36,.35); padding: 14px 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .midrun .l1, .smallrun { display: flex; align-items: center; gap: 14px; }
  .smallrun { flex-direction: row; padding: 0 22px; border-width: 1px; }
  .midrun .nm, .smallrun .nm { font-size: 26px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .smallrun .nm { font-size: 21px; width: 520px; flex: none; }
  .midrun .cnt { color: #c9a86a; font-size: 18px; font-weight: 600; }
  .midrun .el, .smallrun .el { margin-left: auto; font-size: 22px; font-weight: 700; color: #ffd690; font-variant-numeric: tabular-nums; }
  .midrun .l2 { display: flex; align-items: center; gap: 20px; min-width: 0; }
  .midrun .cur { font-size: 19px; color: #ffd690; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip { display: flex; gap: 10px; flex: none; }
  .strip .seg { display: flex; gap: 3px; padding: 4px 6px; border-radius: 6px; background: #15120a; }
  .strip .mini { width: 11px; height: 11px; border-radius: 3px; }
  .pbar { flex: 1; height: 10px; border-radius: 5px; background: #2a2414; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb224, #ffe08a); }
  .dock-fade { position: absolute; left: 0; right: 0; height: 40px; pointer-events: none; z-index: 2; }
  .dock-fade.top { top: 0; background: linear-gradient(#000, transparent); }
  .dock-fade.bottom { bottom: 0; background: linear-gradient(transparent, #000); }

  .split { display: grid; grid-template-columns: 600px 1fr; gap: 18px; flex: none; }
  .rlist { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .rrow { position: relative; border-radius: 14px; background: #0d0b06; border: 1px solid #2a2310; padding: 0 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; transition: background .5s, border-color .5s; flex: none; }
  .rrow .r1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .rrow .nm { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ecdcb8; }
  .rrow .el { margin-left: auto; font-size: 18px; font-weight: 600; color: #c9a86a; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rrow .r2 { display: flex; align-items: center; gap: 12px; }
  .rrow .eta2 { font-size: 16px; color: var(--muted); white-space: nowrap; }
  .rrow .r3 { font-size: 16px; color: #ffd690; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rrow.sel { background: linear-gradient(90deg, #3a2a05, #1c1504); border-color: var(--amber); box-shadow: 0 0 24px rgba(255,178,36,.18); }
  .rrow.sel::after { content: ""; position: absolute; right: -19px; top: 50%; width: 18px; height: 3px; background: var(--amber); transform: translateY(-50%); }
  .rrow.slowrun .el { color: #ff9f6a; }
  .tbar { flex: 1; height: 8px; border-radius: 4px; background: #2a2414; overflow: hidden; }
  .tbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb224, #ffe08a); transition: width .8s ease; }
  .detail { position: relative; display: grid; min-height: 0; min-width: 0; }
  .detail .run { height: 100%; }
  .dwell { position: absolute; left: 24px; right: 24px; bottom: 8px; height: 3px; border-radius: 2px; background: rgba(255,178,36,.12); overflow: hidden; }
  .dwell i { display: block; height: 100%; width: 100%; background: rgba(255,178,36,.6); transform-origin: 0 50%; animation: dwell linear forwards; }
  @keyframes dwell { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .run .eta { display: flex; align-items: center; gap: 14px; font-size: 18px; color: var(--muted); }
  .run .slow { margin-left: 14px; font-size: 15px; letter-spacing: 1px; padding: 3px 10px; border-radius: 6px; background: #3a1606; color: #ffab73; }

  /* ---------- A ---------- */
  .A { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .A .body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 0 40px 30px; min-height: 0; }
  .A .band { display: flex; flex-direction: column; min-height: 0; }
  .grid-fill { display: grid; gap: 14px; min-height: 0; flex: 1; }

  /* ---------- B ---------- */
  .B { position: absolute; inset: 0; display: grid; grid-template-columns: 560px 1fr; }
  .B .board { border-right: 1px solid #12161b; display: flex; flex-direction: column; min-height: 0; padding-bottom: 26px; }
  .B .board .header { padding: 0 30px; }
  .B .rows { display: flex; flex-direction: column; padding: 4px 20px; gap: 5px; min-height: 0; }
  .B .brow { display: grid; grid-template-columns: 8px 1fr auto; gap: 16px; align-items: center; padding: 0 14px 0 0; border-radius: 10px; background: #07090b; min-height: 0; overflow: hidden; }
  .B .brow .bar { align-self: stretch; border-radius: 0 6px 6px 0; }
  .bar.failed { background: var(--red); box-shadow: 0 0 18px var(--red); } .bar.running { background: var(--amber); animation: pulse 1.6s infinite; }
  .bar.passed { background: #16502f; } .bar.never { background: repeating-linear-gradient(180deg, var(--dim) 0 6px, transparent 6px 12px); } .bar.missing { background: var(--red); }
  .B .brow .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .B .brow .sub { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .B .brow .when { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .B .brow.failed .nm { color: #ffb3ba; } .B .brow.running .nm { color: #ffd690; } .B .brow.passed .nm { color: #b9c2cc; }
  .B .stage { padding: 22px 36px 30px; display: flex; flex-direction: column; gap: 20px; min-height: 0; }

  /* ---------- C ---------- */
  .C { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .C .grid { flex: 1; display: grid; grid-auto-flow: dense; gap: 14px; padding: 0 40px 30px; min-height: 0; }
  .C .tile { border-radius: 14px; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0; overflow: hidden; }
  .C .tile .nm { font-weight: 700; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .C .tile .sub { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .C .tile.passed { border-color: #123a25; background: linear-gradient(170deg, #071a10, #050b08); }
  .C .tile.never { border-style: dashed; } .C .tile.missing { border-color: rgba(255,61,77,.6); background: #1a0508; }
</style>
</head>
<body>
<div id="tv"><div id="canvas"></div></div>
<div id="chrome">
  <span class="lbl">Lykta · Command Center</span>
  <span class="sep"></span><span class="lbl">Monitored</span>

// ===================== workflows =====================

function wsum(j) { return j.weights.reduce((a, b) => a + b, 0); }

  canvas.querySelectorAll("[data-graph]").forEach((g) => {
    const w = workflows.find((x) => x.id === g.dataset.graph); if (!w || w.state !== "running") return;
    const s = w.jobs.map((j) => j.status[0] + (j.status === "running" ? j.stepIdx : "")).join("");
    if (sig[w.id] !== s) { sig[w.id] = s; g.innerHTML = graphHtml(w, +g.dataset.maxcols, g.dataset.compact === "1"); }
    else for (const j of w.jobs) { const b = g.querySelector(`[data-bar="${w.id}:${j.id}"]`); if (b) b.style.width = pct(j) + "%"; }
    const card = g.closest(".run"); const pr = card?.querySelector(".progress");
    const ln = card?.querySelector("[data-lanes]"); if (ln) ln.innerHTML = lanesHtml(w, +ln.dataset.n);
    if (pr) pr.textContent = `${w.jobs.filter((j) => j.status === "success").length}/${w.jobs.length} jobs`;
  });
  canvas.querySelectorAll("[data-row]").forEach((r) => {
    const w = workflows.find((x) => x.id === r.dataset.row); if (!w || w.state !== "running") return;
    const t = timing(w); const el = r.querySelector(".el"); if (el) el.textContent = t.txt;
    const b = r.querySelector(".tbar i"); if (b) b.style.width = Math.round(t.f * 100) + "%";
    const e = r.querySelector(".eta2"); if (e) e.textContent = t.eta;
    const j = w.jobs.find((x) => x.status === "running"); const r3 = r.querySelector(".r3"); if (r3 && j) r3.innerHTML = `${esc(j.name)} › ${esc(j.steps[Math.min(j.stepIdx, j.steps.length - 1)])}`;
  });
  canvas.querySelectorAll("[data-timing]").forEach((e) => { const w = workflows.find((x) => x.id === e.dataset.timing); if (w && w.state === "running") e.textContent = timing(w).txt; });
  canvas.querySelectorAll("[data-tbar]").forEach((e) => { const w = workflows.find((x) => x.id === e.dataset.tbar); if (w && w.state === "running") e.style.width = Math.round(timing(w).f * 100) + "%"; });
  canvas.querySelectorAll("[data-eta]").forEach((e) => { const w = workflows.find((x) => x.id === e.dataset.eta); if (w && w.state === "running") e.textContent = timing(w).eta; });
  drawEdges(); paintClock();
}
function paintClock() {
  canvas.querySelectorAll("[data-clock]").forEach((e) => (e.textContent = new Date().toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" })));
  canvas.querySelectorAll("[data-started]").forEach((e) => (e.textContent = dur(+e.dataset.started)));
  canvas.querySelectorAll("[data-since]").forEach((e) => (e.textContent = (e.classList.contains("broken") ? "Broken for " : "") + dur(+e.dataset.since)));
}
function drawEdges() {
  canvas.querySelectorAll("[data-graph]").forEach((g) => {
    const w = workflows.find((x) => x.id === g.dataset.graph); if (!w) return;
    const m = graphModel(w, +g.dataset.maxcols); const svg = g.querySelector("svg"); if (!svg) return;
    const base = g.getBoundingClientRect(); let paths = "";
    for (const e of m.edges) {
      const [from, to] = e.split(">");
      const a = g.querySelector(`[data-node="${w.id}:${from}"]`)?.getBoundingClientRect(), b = g.querySelector(`[data-node="${w.id}:${to}"]`)?.getBoundingClientRect();
      if (!a || !b) continue;
      const x1 = (a.right - base.left) / scale, y1 = (a.top + a.height / 2 - base.top) / scale, x2 = (b.left - base.left) / scale, y2 = (b.top + b.height / 2 - base.top) / scale, mx = (x1 + x2) / 2;
      const sf = m.nodeById[from].status, st = m.nodeById[to].status;
      const color = sf === "failure" ? "#ff3d4d" : sf === "success" ? (st === "queued" ? "#24402f" : "#2fe07f") : "#2a2f37";
      paths += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round" ${st === "running" ? 'stroke-dasharray="8 8" class="flow"' : ""}/>`;
    }
    svg.innerHTML = `<style>.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}</style>` + paths;
  });
}
setInterval(() => { page++; structural(); }, 12000);   // rotate pages of the less important content

  document.querySelectorAll("[data-count]").forEach((x) => x.classList.toggle("on", x === b));
  seed(+b.dataset.count); page = 0; setRunTarget(runTarget);
}));

}));
document.getElementById("breakit").onclick = breakOne;

new ResizeObserver(() => fit()).observe(document.documentElement);
