<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <title>Lykta: a GitHub Actions wall nobody can ignore</title>
  <defs>
    <radialGradient id="bg" cx="22%" cy="55%" r="80%">
      <stop offset="0" stop-color="#2a1a05"/>
      <stop offset="0.45" stop-color="#0d0b08"/>
