[package]
name = "lykta"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A highly visible dashboard for monitoring GitHub Actions workflows"
readme = "../../README.md"
keywords = ["github", "actions", "workflows", "dashboard", "ci"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lykta"
path = "src/main.rs"

[dependencies]
lykta-core.workspace = true
ailloy.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
semver.workspace = true
chrono.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/lykta-v{ version }-{ target }.{ archive-format }"
bin-dir = "lykta{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
