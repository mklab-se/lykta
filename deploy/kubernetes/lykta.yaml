# Lykta as plain Kubernetes manifests (rendered from deploy/helm/lykta). Edit the ConfigMap's
# lykta.yaml, create the Secret (see the comment below), then: kubectl apply -f lykta.yaml
#
#   kubectl create secret generic lykta-secrets --from-literal=LYKTA_TOKEN_MY_ORG=<token>
---
# Source: lykta/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: lykta
  labels:
    app.kubernetes.io/name: lykta
    app.kubernetes.io/instance: lykta
    app.kubernetes.io/version: "0.1.0"
data:
  lykta.yaml: |
    title: Our builds
    organizations:
      my-org:
        auth: token
    monitor:
      - repo: my-org/my-repo
        workflow: ci.yml
---
# Source: lykta/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: lykta
  labels:
    app.kubernetes.io/name: lykta
    app.kubernetes.io/instance: lykta
    app.kubernetes.io/version: "0.1.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lykta
    app.kubernetes.io/instance: lykta
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Source: lykta/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lykta
  labels:
    app.kubernetes.io/name: lykta
    app.kubernetes.io/instance: lykta
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lykta
      app.kubernetes.io/instance: lykta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lykta
        app.kubernetes.io/instance: lykta
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lykta
          image: "ghcr.io/mklab-se/lykta:0.1.0"
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LYKTA_CONFIG_FILE
              value: /config/lykta.yaml
            - name: LYKTA_MCP
              value: "off"
          envFrom:
            - secretRef:
                name: lykta-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: lykta
        - name: tmp
          emptyDir: {}
