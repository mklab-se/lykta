# Example Lykta configuration. Copy to lykta.yaml and adapt.
# Secrets never go in this file: set them as environment variables (or *_FILE variants):
#   auth: token -> LYKTA_TOKEN_<ORG>   e.g. LYKTA_TOKEN_MKLAB_SE
#   auth: app   -> LYKTA_APP_ID and LYKTA_APP_PRIVATE_KEY (or LYKTA_APP_PRIVATE_KEY_FILE)

title: Lykta live test

defaults:
  branch: main
  # runs started by these triggers never count on the wall (e.g. manual experiments)
  ignoreEvents: []

organizations:
  mklab-se:
    auth: token

# One entry = one tile, shown in this order. Watching the same workflow on another branch is
# another entry. Optional per entry (or under defaults): labels, shown as #hashtags and used for
# filtering, and a color for those label tags; teams sharing a wall can tell their tiles apart.
monitor:
  - repo: mklab-se/lykta
    workflow: live-pipeline.yml
    name: Live pipeline
  - repo: mklab-se/lykta
    workflow: live-quick.yml
    name: Live quick
  - repo: mklab-se/lykta
    workflow: ci.yml
    name: Lykta CI
  - repo: mklab-se/lykta
    workflow: live-android.yml
    name: Android nightly
    labels: [mobile]
    color: "#a78bfa"
  - repo: mklab-se/lykta
    workflow: live-deploy.yml
    name: Deploy staging
    labels: [platform]
    color: "#38bdf8"
  - repo: mklab-se/lykta
    workflow: live-security.yml
    name: Security scan
    labels: [platform]
    color: "#38bdf8"
  - repo: mklab-se/lykta
    workflow: live-release.yml
    name: Release dry run
    labels: [platform]
    color: "#38bdf8"
  - repo: mklab-se/lykta
    workflow: live-integration.yml
    name: Integration checks
    labels: [mobile]
    color: "#a78bfa"
  - repo: mklab-se/lykta
    workflow: live-docs.yml
    name: Docs site

# Optional: describe where jobs run. The first matching rule wins.
runners:
  - match: { runnerName: "lab-bench-2*" }
    kind: lab
    label: "lab-bench-2 · Pixel 9"
  - match: { group: "arc-aosp-64core" }
    kind: k8s

server:
  port: 8080
